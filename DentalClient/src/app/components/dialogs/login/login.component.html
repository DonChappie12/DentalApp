
<!-- <ng-template pTemplate="headless"> -->
  <!-- <p-progressSpinner ariaLabel="loading" *ngIf="isProgressBarVisible" strokeWidth="5"/> -->
  <div class="flex flex-column px-8 py-5 gap-4">
    <form [formGroup]="loginCredentials" (ngSubmit)="SubmitCredentials()">
      <div class="inline-flex flex-column gap-2">
        <label for="username">Username</label>
        <input
            pInputText
            id="username"
            aria-describedby="username-help"
            formControlName="alias"/>
        <small id="username-help">
            Enter your username.
        </small>
      </div>
      <div class="inline-flex flex-column gap-2">
        <label for="username">Password</label>
        <p-password
            id="password"
            [toggleMask]="true"
            [feedback]="false"
            aria-describedby="password-help"
            formControlName="password"/>
        <small id="password-help">
            Enter your password.
        </small>
      </div>
      <div class="flex align-items-center gap-2">
          <p-button type="submit" label="Sign-In" [disabled]="!loginCredentials.valid" [text]="true" styleClass="p-3 w-full text-primary-50 border-1 border-white-alpha-30 hover:bg-white-alpha-10" class="w-full"  />
          <p-button label="Cancel" (onClick)="closeDialog()" [text]="true"  styleClass="p-3 w-full text-primary-50 border-1 border-white-alpha-30 hover:bg-white-alpha-10" class="w-full" />
      </div>
    </form>
  </div>
  <div>
    <p-messages
    [(value)]="errorMessages"
    [enableService]="false"
    [closable]="false" />
  </div>
<!-- </ng-template> -->
